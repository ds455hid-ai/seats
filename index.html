<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>やることメモ</title>
<style>
  :root{
    --bg:#f7f7f5;
    --card:#ffffff;
    --border:#e4e4e4;
    --text:#222222;
    --sub:#999999;
    --faint:#c0c0c0;
    --accent:#5b8dee;
    --accent-dark:#3a6fd8;
    --danger:#e05555;
    --done:#56c96b;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{overflow-x:hidden}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Helvetica Neue",sans-serif;
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
    padding:20px 14px calc(60px + env(safe-area-inset-bottom));
  }
  .wrap{max-width:560px;margin:0 auto}

  h1{font-size:21px;font-weight:800;text-align:center;letter-spacing:.04em}
  .today{text-align:center;font-size:13px;color:var(--sub);margin:4px 0 18px}

  /* quick add */
  .quick{background:var(--card);border-radius:16px;padding:12px;box-shadow:0 1px 6px rgba(0,0,0,.06);margin-bottom:16px}
  .quick-row{display:flex;gap:8px}
  #taskInput{
    flex:1;padding:13px 14px;border:2px solid var(--border);border-radius:12px;
    font-size:16px;outline:none;background:#fff;transition:border-color .15s;
  }
  #taskInput:focus{border-color:var(--accent)}
  .add-btn{
    padding:0 18px;background:var(--accent);color:#fff;border:0;border-radius:12px;
    font-size:16px;font-weight:800;cursor:pointer;white-space:nowrap;transition:background .15s;
  }
  .add-btn:active{background:var(--accent-dark)}

  .detail-toggle{
    display:inline-flex;align-items:center;gap:4px;margin-top:8px;font-size:12px;color:var(--sub);
    cursor:pointer;user-select:none;
  }
  .detail-toggle:active{color:var(--accent)}
  .detail{display:none;margin-top:10px;padding-top:10px;border-top:1px dashed var(--border);gap:10px;flex-direction:column}
  .detail.open{display:flex}
  .detail-row{display:flex;align-items:center;gap:8px}
  .detail-label{font-size:12px;color:var(--sub);width:46px;flex-shrink:0}
  input[type="date"]{
    flex:1;padding:8px 10px;border:2px solid var(--border);border-radius:10px;
    font-size:14px;outline:none;background:#fff;color:#444;
  }
  input[type="date"]:focus{border-color:var(--accent)}
  .prio-row{display:flex;gap:6px;flex:1}
  .prio-btn{
    flex:1;padding:7px 0;border:2px solid var(--border);border-radius:10px;background:#fff;
    font-size:12px;font-weight:800;color:var(--sub);cursor:pointer;
  }
  .prio-btn[data-q="important"].active{border-color:#7fb3ff;background:#eef5ff;color:#3a6fd8}
  .prio-btn[data-q="urgent"].active{border-color:#f4c25a;background:#fff8e6;color:#a3730a}

  /* view switch */
  .view-switch{display:flex;gap:6px;margin-bottom:10px;background:#ececea;border-radius:12px;padding:4px}
  .view-btn{
    flex:1;padding:8px 0;text-align:center;border-radius:9px;font-size:13px;font-weight:800;
    color:var(--sub);background:transparent;border:0;cursor:pointer;
  }
  .view-btn.active{background:var(--card);color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.08)}

  /* filter tabs */
  .tabs{display:flex;gap:6px;margin-bottom:12px}
  .tab{
    flex:1;padding:9px 0;text-align:center;border-radius:10px;font-size:13px;font-weight:700;
    color:var(--sub);background:transparent;border:0;cursor:pointer;
  }
  .tab.active{background:var(--card);color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.06)}
  .tab .count{opacity:.6;font-weight:600;margin-left:2px}

  .task-list{list-style:none;display:flex;flex-direction:column;gap:8px}

  .task-item{
    display:flex;align-items:flex-start;gap:10px;background:var(--card);padding:13px 12px;
    border-radius:14px;box-shadow:0 1px 4px rgba(0,0,0,.07);
    border-left:5px solid transparent;
    transition:box-shadow .15s,opacity .15s,transform .1s;
  }
  .task-item.q-do{border-left-color:#f08080}
  .task-item.q-schedule{border-left-color:#7fb3ff}
  .task-item.q-delegate{border-left-color:#f4c25a}
  .task-item.dragging{opacity:.35}
  .task-item.drag-over{box-shadow:0 0 0 2px var(--accent),0 4px 16px rgba(91,141,238,.18)}

  .handle{color:#cfcfcf;font-size:19px;cursor:grab;flex-shrink:0;touch-action:none;line-height:1.5;padding-top:2px}

  .check-btn{
    width:25px;height:25px;border-radius:50%;border:2px solid #d4d4d4;background:#fff;cursor:pointer;
    flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff;
    transition:all .15s;margin-top:1px;
  }
  .task-item.done .check-btn, .matrix-card.done .check-btn{background:var(--done);border-color:var(--done)}

  .task-main{flex:1;min-width:0}
  .task-text{font-size:15.5px;line-height:1.4;word-break:break-word;outline:none}
  .task-item.done .task-text{text-decoration:line-through;color:var(--faint)}
  .task-text[contenteditable="true"]{border-bottom:1px dashed var(--accent)}

  .badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
  .task-item.done .badges{opacity:.4}
  .due-badge, .quad-badge{
    display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:700;
    letter-spacing:.02em;cursor:pointer;
  }
  .due-badge.overdue{background:#fde8e8;color:#d63c3c}
  .due-badge.today{background:#fff0e0;color:#e07b00}
  .due-badge.soon{background:#fff8e0;color:#b08000}
  .due-badge.future{background:#eef3fd;color:#5b8dee}
  .quad-badge{cursor:default}
  .quad-badge.do{background:#fdeaea;color:#c23a3a}
  .quad-badge.schedule{background:#eef5ff;color:#3a6fd8}
  .quad-badge.delegate{background:#fff8e6;color:#a3730a}
  .add-due-link{display:inline-block;font-size:11.5px;color:#ccc;cursor:pointer}
  .add-due-link:active{color:var(--accent)}

  .due-editor{display:flex;align-items:center;gap:6px;margin-top:6px;flex-wrap:wrap}
  .due-editor input[type="date"]{padding:5px 9px;border-color:var(--accent);font-size:12.5px}
  .btn-nondue{padding:5px 9px;background:none;border:1px solid #ddd;border-radius:8px;font-size:11.5px;color:#aaa;cursor:pointer;white-space:nowrap}
  .btn-nondue:active{border-color:var(--danger);color:var(--danger)}
  .btn-cancel{background:none;border:none;font-size:17px;color:#ccc;cursor:pointer;line-height:1;padding:0 2px}

  .delete-btn{color:var(--faint);background:none;border:none;font-size:21px;cursor:pointer;flex-shrink:0;line-height:1;padding:0 2px 0 4px;transition:color .2s;margin-top:1px}
  .delete-btn:active{color:var(--danger)}
  .delete-btn.small{font-size:17px}

  .empty{text-align:center;color:var(--faint);padding:44px 0;font-size:14px}

  .clear-done{display:block;margin:16px auto 0;background:none;border:1px solid #ddd;color:#aaa;font-size:12.5px;padding:7px 16px;border-radius:8px;cursor:pointer}
  .clear-done:active{border-color:var(--danger);color:var(--danger)}

  .status{text-align:center;font-size:12px;color:var(--faint);margin-top:20px}

  /* matrix view */
  .matrix-grid{
    display:grid;grid-template-columns:1fr 1fr;gap:8px;
  }
  .quadrant{
    background:var(--card);border-radius:14px;padding:10px;min-height:140px;
    box-shadow:0 1px 4px rgba(0,0,0,.06);border:2px solid transparent;transition:border-color .12s,box-shadow .12s;
  }
  .quadrant.drag-over{border-color:var(--accent);box-shadow:0 0 0 2px rgba(91,141,238,.18)}
  .quadrant.q-do{background:linear-gradient(#fff,#fff8f8)}
  .quadrant.q-schedule{background:linear-gradient(#fff,#f6f9ff)}
  .quadrant.q-delegate{background:linear-gradient(#fff,#fffbf0)}
  .quadrant.q-none{background:linear-gradient(#fff,#f9f9f8)}
  .quadrant-head{margin-bottom:8px}
  .q-title{display:block;font-size:13px;font-weight:800}
  .q-sub{display:block;font-size:10.5px;color:var(--sub);margin-top:1px}
  .quadrant-list{display:flex;flex-direction:column;gap:6px}
  .q-empty{font-size:11.5px;color:var(--faint);padding:6px 2px}

  .matrix-card{
    display:flex;align-items:center;gap:6px;background:#fff;border-radius:10px;padding:7px 8px;
    box-shadow:0 1px 3px rgba(0,0,0,.08);transition:opacity .15s;
  }
  .matrix-card.dragging{opacity:.35}
  .matrix-card.done .m-text{text-decoration:line-through;color:var(--faint)}
  .m-handle{color:#d5d5d5;font-size:16px;cursor:grab;flex-shrink:0;touch-action:none;line-height:1}
  .check-btn.small{width:20px;height:20px;font-size:11px}
  .m-text{flex:1;min-width:0;font-size:12.5px;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  .matrix-hint{text-align:center;font-size:11.5px;color:var(--faint);margin-top:10px}
</style>
</head>
<body>
<div class="wrap">
  <h1>やることメモ</h1>
  <div class="today" id="todayLabel"></div>

  <div class="quick">
    <div class="quick-row">
      <input type="text" id="taskInput" placeholder="思いついたことをすぐメモ..." autocomplete="off" />
      <button class="add-btn" onclick="addTask()">追加</button>
    </div>
    <div class="detail-toggle" id="detailToggle" onclick="toggleDetail()">＋ 期限・分類を追加</div>
    <div class="detail" id="detailArea">
      <div class="detail-row">
        <span class="detail-label">期限</span>
        <input type="date" id="dueInput" />
      </div>
      <div class="detail-row">
        <span class="detail-label">分類</span>
        <div class="prio-row">
          <button type="button" class="prio-btn" data-q="important" onclick="toggleQuick('important')">重要</button>
          <button type="button" class="prio-btn" data-q="urgent" onclick="toggleQuick('urgent')">緊急</button>
        </div>
      </div>
    </div>
  </div>

  <div class="view-switch">
    <button class="view-btn active" data-v="list" onclick="setView('list')">📋 リスト</button>
    <button class="view-btn" data-v="matrix" onclick="setView('matrix')">🔲 マトリクス</button>
  </div>

  <div id="listView">
    <div class="tabs">
      <button class="tab active" data-f="all" onclick="setFilter('all')">すべて<span class="count" id="cAll"></span></button>
      <button class="tab" data-f="active" onclick="setFilter('active')">未完了<span class="count" id="cActive"></span></button>
      <button class="tab" data-f="done" onclick="setFilter('done')">完了<span class="count" id="cDone"></span></button>
    </div>

    <ul class="task-list" id="taskList"></ul>
    <button class="clear-done" id="clearDoneBtn" onclick="clearDone()" style="display:none">完了済みを削除</button>
  </div>

  <div id="matrixView" style="display:none">
    <div class="matrix-grid">
      <div class="quadrant q-do" data-important="1" data-urgent="1">
        <div class="quadrant-head">
          <span class="q-title">🔥 今すぐやる</span>
          <span class="q-sub">緊急・重要</span>
        </div>
        <div class="quadrant-list" id="qlist-do"></div>
      </div>
      <div class="quadrant q-schedule" data-important="1" data-urgent="0">
        <div class="quadrant-head">
          <span class="q-title">🗓 計画する</span>
          <span class="q-sub">重要・緊急でない</span>
        </div>
        <div class="quadrant-list" id="qlist-schedule"></div>
      </div>
      <div class="quadrant q-delegate" data-important="0" data-urgent="1">
        <div class="quadrant-head">
          <span class="q-title">🤝 任せる</span>
          <span class="q-sub">緊急・重要でない</span>
        </div>
        <div class="quadrant-list" id="qlist-delegate"></div>
      </div>
      <div class="quadrant q-none" data-important="0" data-urgent="0">
        <div class="quadrant-head">
          <span class="q-title">🗑 やめる／後で</span>
          <span class="q-sub">緊急でも重要でもない</span>
        </div>
        <div class="quadrant-list" id="qlist-none"></div>
      </div>
    </div>
    <div class="matrix-hint">タスクをドラッグすると分類を変更できます</div>
  </div>

  <div class="status" id="status">読み込み中...</div>
</div>

<script>
  const STORAGE_KEY = 'yarukoto-memo-tasks-v1';

  let tasks = [];
  let filter = 'all';
  let view = 'list';
  let pendingImportant = false;
  let pendingUrgent = false;
  let isDragging = false;
  let editingDueId = null;

  (function () {
    const d = new Date();
    const days = ['日', '月', '火', '水', '木', '金', '土'];
    document.getElementById('todayLabel').textContent =
      `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日（${days[d.getDay()]}）`;
  })();

  function migrate(t) {
    if (t.important === undefined || t.urgent === undefined) {
      if (t.priority === 'high') { t.important = true; t.urgent = true; }
      else if (t.priority === 'mid') { t.important = true; t.urgent = false; }
      else if (t.priority === 'low') { t.important = false; t.urgent = true; }
      else { t.important = false; t.urgent = false; }
    }
    delete t.priority;
    return t;
  }

  function load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      tasks = raw ? JSON.parse(raw).map(migrate) : [];
    } catch (e) {
      tasks = [];
    }
    render();
    document.getElementById('status').textContent = '保存済み ✓';
  }

  function save() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
    document.getElementById('status').textContent = '保存済み ✓';
  }

  function uid() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }

  function toggleDetail() {
    document.getElementById('detailArea').classList.toggle('open');
  }

  function toggleQuick(field) {
    if (field === 'important') pendingImportant = !pendingImportant;
    if (field === 'urgent') pendingUrgent = !pendingUrgent;
    document.querySelector('.prio-btn[data-q="important"]').classList.toggle('active', pendingImportant);
    document.querySelector('.prio-btn[data-q="urgent"]').classList.toggle('active', pendingUrgent);
  }

  function setFilter(f) {
    filter = f;
    document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b.dataset.f === f));
    render();
  }

  function setView(v) {
    view = v;
    document.querySelectorAll('.view-btn').forEach(b => b.classList.toggle('active', b.dataset.v === v));
    document.getElementById('listView').style.display = v === 'list' ? '' : 'none';
    document.getElementById('matrixView').style.display = v === 'matrix' ? '' : 'none';
  }

  function quadrantKey(t) {
    if (t.important && t.urgent) return 'do';
    if (t.important && !t.urgent) return 'schedule';
    if (!t.important && t.urgent) return 'delegate';
    return 'none';
  }

  const QUAD_LABEL = { do: '今すぐ', schedule: '計画', delegate: '任せる' };

  function daysLeft(dueStr) {
    if (!dueStr) return null;
    const today = new Date();
    today.setHours(0, 0, 0, 0);
    const due = new Date(dueStr + 'T00:00:00');
    return Math.round((due - today) / 86400000);
  }

  function dueBadgeHtml(dueStr) {
    const diff = daysLeft(dueStr);
    if (diff === null) return '';
    if (diff < 0) return `<span class="due-badge overdue">${Math.abs(diff)}日超過</span>`;
    if (diff === 0) return `<span class="due-badge today">今日まで</span>`;
    if (diff <= 3) return `<span class="due-badge soon">あと${diff}日</span>`;
    return `<span class="due-badge future">あと${diff}日</span>`;
  }

  function startEditDue(id) {
    editingDueId = id;
    render();
    setTimeout(() => {
      const input = document.getElementById('due-edit-' + id);
      if (input) input.focus();
    }, 30);
  }

  function saveDue(id) {
    const input = document.getElementById('due-edit-' + id);
    const t = tasks.find(t => t.id === id);
    if (t && input) t.due = input.value || null;
    editingDueId = null;
    save();
    render();
  }

  function clearDue(id) {
    const t = tasks.find(t => t.id === id);
    if (t) t.due = null;
    editingDueId = null;
    save();
    render();
  }

  function cancelEditDue() {
    editingDueId = null;
    render();
  }

  function escapeHtml(str) {
    return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function addTask() {
    const input = document.getElementById('taskInput');
    const due = document.getElementById('dueInput');
    const text = input.value.trim();
    if (!text) return;
    tasks.push({
      id: uid(),
      text,
      done: false,
      due: due.value || null,
      important: pendingImportant,
      urgent: pendingUrgent,
      createdAt: Date.now(),
    });
    save();
    input.value = '';
    due.value = '';
    pendingImportant = false;
    pendingUrgent = false;
    document.querySelectorAll('.prio-btn').forEach(b => b.classList.remove('active'));
    render();
    input.focus();
  }

  function toggleDone(id) {
    const t = tasks.find(t => t.id === id);
    if (t) t.done = !t.done;
    save();
    render();
  }

  function deleteTask(id) {
    tasks = tasks.filter(t => t.id !== id);
    save();
    render();
  }

  function clearDone() {
    tasks = tasks.filter(t => !t.done);
    save();
    render();
  }

  function classifyTask(id, important, urgent) {
    const t = tasks.find(t => t.id === id);
    if (!t) return;
    t.important = important;
    t.urgent = urgent;
    save();
    render();
  }

  function startEditText(id, el) {
    if (isDragging) return;
    el.setAttribute('contenteditable', 'true');
    el.focus();
    document.execCommand('selectAll', false, null);
  }

  function finishEditText(id, el) {
    el.removeAttribute('contenteditable');
    const text = el.textContent.trim();
    const t = tasks.find(t => t.id === id);
    if (!t) return;
    if (!text) {
      deleteTask(id);
      return;
    }
    if (text !== t.text) {
      t.text = text;
      save();
    }
    render();
  }

  function visibleTasks() {
    if (filter === 'active') return tasks.filter(t => !t.done);
    if (filter === 'done') return tasks.filter(t => t.done);
    return tasks;
  }

  function render() {
    renderListView();
    renderMatrix();
  }

  function renderListView() {
    const list = document.getElementById('taskList');
    const clearBtn = document.getElementById('clearDoneBtn');
    const vis = visibleTasks();

    document.getElementById('cAll').textContent = tasks.length ? ` ${tasks.length}` : '';
    document.getElementById('cActive').textContent = tasks.filter(t => !t.done).length ? ` ${tasks.filter(t => !t.done).length}` : '';
    document.getElementById('cDone').textContent = tasks.filter(t => t.done).length ? ` ${tasks.filter(t => t.done).length}` : '';

    clearBtn.style.display = tasks.some(t => t.done) ? 'block' : 'none';

    if (vis.length === 0) {
      list.innerHTML = `<div class="empty">${tasks.length === 0 ? 'タスクはありません' : '該当するタスクがありません'}</div>`;
      return;
    }

    list.innerHTML = '';
    const reorderable = filter === 'all';

    vis.forEach((task) => {
      const qkey = quadrantKey(task);
      const li = document.createElement('li');
      li.className = 'task-item' + (task.done ? ' done' : '') + (qkey !== 'none' ? ' q-' + qkey : '');
      li.dataset.id = task.id;
      li.draggable = reorderable;

      const quadBadge = qkey !== 'none' ? `<span class="quad-badge ${qkey}">${QUAD_LABEL[qkey]}</span>` : '';

      let dueSection = '';
      if (editingDueId === task.id) {
        dueSection = `
          <div class="due-editor">
            <input type="date" id="due-edit-${task.id}" value="${task.due || ''}" onchange="saveDue('${task.id}')" />
            <button class="btn-nondue" onclick="clearDue('${task.id}')">期限なし</button>
            <button class="btn-cancel" onclick="cancelEditDue()">×</button>
          </div>`;
      } else if (task.due) {
        dueSection = `<div class="badges" onclick="startEditDue('${task.id}')">${quadBadge}${dueBadgeHtml(task.due)}</div>`;
      } else {
        dueSection = `${quadBadge ? `<div class="badges">${quadBadge}</div>` : ''}<span class="add-due-link" onclick="startEditDue('${task.id}')">＋ 期限を追加</span>`;
      }

      li.innerHTML = `
        ${reorderable ? '<span class="handle">⠿</span>' : ''}
        <button class="check-btn" onclick="toggleDone('${task.id}')">${task.done ? '✓' : ''}</button>
        <div class="task-main">
          <div class="task-text" ondblclick="startEditText('${task.id}', this)">${escapeHtml(task.text)}</div>
          ${dueSection}
        </div>
        <button class="delete-btn" onclick="deleteTask('${task.id}')">×</button>
      `;

      const textEl = li.querySelector('.task-text');
      textEl.addEventListener('blur', () => finishEditText(task.id, textEl));
      textEl.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          textEl.blur();
        }
      });

      if (reorderable) {
        li.addEventListener('dragstart', onDragStart);
        li.addEventListener('dragover', onDragOver);
        li.addEventListener('drop', onDrop);
        li.addEventListener('dragend', onDragEnd);
        li.querySelector('.handle').addEventListener('touchstart', onTouchStart, { passive: false });
      }

      list.appendChild(li);
    });
  }

  function renderMatrix() {
    const groups = { do: [], schedule: [], delegate: [], none: [] };
    visibleTasks().forEach(t => groups[quadrantKey(t)].push(t));

    Object.keys(groups).forEach(key => {
      const container = document.getElementById('qlist-' + key);
      if (!container) return;
      if (!groups[key].length) {
        container.innerHTML = '<div class="q-empty">なし</div>';
        return;
      }
      container.innerHTML = '';
      groups[key].forEach(t => container.appendChild(buildMatrixCard(t)));
    });
  }

  function buildMatrixCard(task) {
    const div = document.createElement('div');
    div.className = 'matrix-card' + (task.done ? ' done' : '');
    div.draggable = true;
    div.dataset.id = task.id;
    div.innerHTML = `
      <span class="m-handle">⠿</span>
      <button class="check-btn small" onclick="toggleDone('${task.id}')">${task.done ? '✓' : ''}</button>
      <span class="m-text">${escapeHtml(task.text)}</span>
      <button class="delete-btn small" onclick="deleteTask('${task.id}')">×</button>
    `;
    div.addEventListener('dragstart', onMatrixDragStart);
    div.addEventListener('dragend', onMatrixDragEnd);
    div.querySelector('.m-handle').addEventListener('touchstart', onMatrixTouchStart, { passive: false });
    return div;
  }

  // --- Desktop drag & drop (list reorder) ---
  let dragSrc = null;

  function onDragStart(e) {
    isDragging = true;
    dragSrc = this;
    this.classList.add('dragging');
    e.dataTransfer.effectAllowed = 'move';
  }

  function onDragOver(e) {
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
    document.querySelectorAll('.task-item').forEach(el => el.classList.remove('drag-over'));
    this.classList.add('drag-over');
  }

  function onDrop(e) {
    e.stopPropagation();
    if (dragSrc && dragSrc !== this) {
      reorder(dragSrc.dataset.id, this.dataset.id);
    }
  }

  function onDragEnd() {
    isDragging = false;
    document.querySelectorAll('.task-item').forEach(el => el.classList.remove('dragging', 'drag-over'));
    dragSrc = null;
  }

  function reorder(fromId, toId) {
    const from = tasks.findIndex(t => t.id === fromId);
    const to = tasks.findIndex(t => t.id === toId);
    if (from === -1 || to === -1) return;
    const [moved] = tasks.splice(from, 1);
    tasks.splice(to, 0, moved);
    save();
    render();
  }

  // --- Mobile touch drag (list reorder) ---
  let touchItem = null;
  let touchClone = null;

  function onTouchStart(e) {
    e.preventDefault();
    isDragging = true;
    touchItem = this.closest('.task-item');

    const rect = touchItem.getBoundingClientRect();
    touchClone = touchItem.cloneNode(true);
    touchClone.style.cssText = `
      position: fixed;
      left: ${rect.left}px;
      top: ${rect.top}px;
      width: ${rect.width}px;
      opacity: 0.85;
      pointer-events: none;
      z-index: 9999;
      box-shadow: 0 8px 28px rgba(0,0,0,0.18);
      border-radius: 14px;
      transition: none;
    `;
    document.body.appendChild(touchClone);
    touchItem.classList.add('dragging');

    document.addEventListener('touchmove', onTouchMove, { passive: false });
    document.addEventListener('touchend', onTouchEnd);
  }

  function onTouchMove(e) {
    e.preventDefault();
    const touch = e.touches[0];
    touchClone.style.top = (touch.clientY - 28) + 'px';

    document.querySelectorAll('.task-item:not(.dragging)').forEach(el => el.classList.remove('drag-over'));
    touchClone.style.display = 'none';
    const el = document.elementFromPoint(touch.clientX, touch.clientY);
    touchClone.style.display = '';
    const target = el?.closest('.task-item');
    if (target && target !== touchItem) target.classList.add('drag-over');
  }

  function onTouchEnd(e) {
    document.removeEventListener('touchmove', onTouchMove);
    document.removeEventListener('touchend', onTouchEnd);

    if (touchClone) {
      const touch = e.changedTouches[0];
      touchClone.style.display = 'none';
      const el = document.elementFromPoint(touch.clientX, touch.clientY);
      const target = el?.closest('.task-item');

      if (target && target !== touchItem) {
        reorder(touchItem.dataset.id, target.dataset.id);
      }

      touchClone.remove();
      touchClone = null;
    }

    touchItem?.classList.remove('dragging');
    touchItem = null;
    isDragging = false;
    document.querySelectorAll('.task-item').forEach(el => el.classList.remove('drag-over', 'dragging'));
  }

  // --- Desktop drag & drop (matrix reclassify) ---
  let mDragId = null;

  function onMatrixDragStart(e) {
    isDragging = true;
    mDragId = this.dataset.id;
    this.classList.add('dragging');
    e.dataTransfer.effectAllowed = 'move';
  }

  function onMatrixDragEnd() {
    isDragging = false;
    document.querySelectorAll('.matrix-card').forEach(el => el.classList.remove('dragging'));
    document.querySelectorAll('.quadrant').forEach(el => el.classList.remove('drag-over'));
    mDragId = null;
  }

  function setupQuadrantDropzones() {
    document.querySelectorAll('.quadrant').forEach(q => {
      q.addEventListener('dragover', e => {
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
        document.querySelectorAll('.quadrant').forEach(el => el.classList.remove('drag-over'));
        q.classList.add('drag-over');
      });
      q.addEventListener('drop', e => {
        e.preventDefault();
        if (mDragId) classifyTask(mDragId, q.dataset.important === '1', q.dataset.urgent === '1');
        q.classList.remove('drag-over');
      });
    });
  }

  // --- Mobile touch drag (matrix reclassify) ---
  let mTouchItem = null;
  let mTouchClone = null;

  function onMatrixTouchStart(e) {
    e.preventDefault();
    isDragging = true;
    mTouchItem = this.closest('.matrix-card');
    mDragId = mTouchItem.dataset.id;

    const rect = mTouchItem.getBoundingClientRect();
    mTouchClone = mTouchItem.cloneNode(true);
    mTouchClone.style.cssText = `
      position: fixed;
      left: ${rect.left}px;
      top: ${rect.top}px;
      width: ${rect.width}px;
      opacity: 0.85;
      pointer-events: none;
      z-index: 9999;
      box-shadow: 0 8px 28px rgba(0,0,0,0.18);
      border-radius: 10px;
      background: #fff;
      transition: none;
    `;
    document.body.appendChild(mTouchClone);
    mTouchItem.classList.add('dragging');

    document.addEventListener('touchmove', onMatrixTouchMove, { passive: false });
    document.addEventListener('touchend', onMatrixTouchEnd);
  }

  function onMatrixTouchMove(e) {
    e.preventDefault();
    const touch = e.touches[0];
    mTouchClone.style.top = (touch.clientY - 18) + 'px';
    mTouchClone.style.left = (touch.clientX - 18) + 'px';

    document.querySelectorAll('.quadrant').forEach(el => el.classList.remove('drag-over'));
    mTouchClone.style.display = 'none';
    const el = document.elementFromPoint(touch.clientX, touch.clientY);
    mTouchClone.style.display = '';
    const target = el?.closest('.quadrant');
    if (target) target.classList.add('drag-over');
  }

  function onMatrixTouchEnd(e) {
    document.removeEventListener('touchmove', onMatrixTouchMove);
    document.removeEventListener('touchend', onMatrixTouchEnd);

    if (mTouchClone) {
      const touch = e.changedTouches[0];
      mTouchClone.style.display = 'none';
      const el = document.elementFromPoint(touch.clientX, touch.clientY);
      const target = el?.closest('.quadrant');
      if (target && mDragId) {
        classifyTask(mDragId, target.dataset.important === '1', target.dataset.urgent === '1');
      }
      mTouchClone.remove();
      mTouchClone = null;
    }

    mTouchItem?.classList.remove('dragging');
    mTouchItem = null;
    mDragId = null;
    isDragging = false;
    document.querySelectorAll('.quadrant').forEach(el => el.classList.remove('drag-over'));
  }

  document.getElementById('taskInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') addTask();
  });

  setupQuadrantDropzones();
  load();
</script>
</body>
</html>
